openapi: 3.0.3
info:
  title: Smriti v2 Enterprise Intelligence Tool
  version: 0.1.0
  description: >-
    High-code Enterprise Intelligence and Organizational Memory engine hosted on
    Google Cloud Run. Invoked by Gemini Enterprise to answer deterministic KPI,
    planning, competitor, and institutional memory queries with verified citations.
servers:
  - url: https://REPLACE_WITH_CLOUD_RUN_SERVICE_URL
    description: Google Cloud Run production/dev service endpoint (europe-west1)
paths:
  /v1/query:
    post:
      operationId: querySmriti
      summary: Execute a deterministic Smriti enterprise query
      description: >-
        Routes a natural-language user question to the Smriti v2 Cloud Run engine
        and returns verified Markdown prose, tables, and source citations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmritiQueryRequest"
      responses:
        "200":
          description: Verified and cited Smriti response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmritiQueryResponse"
components:
  schemas:
    SmritiQueryRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 2
          description: Natural language user request from Gemini Enterprise chat
        domain_hint:
          type: string
          nullable: true
          description: Optional target domain identifier; uses registered default domain when omitted
        session_id:
          type: string
          nullable: true
          description: Optional Gemini Enterprise session identifier for short-term thread continuity
    Citation:
      type: object
      required:
        - source
        - object_name
        - date_window_ist
      properties:
        source:
          type: string
          description: Canonical data connector or governed memory store name
        object_name:
          type: string
          description: Exact view, table, account, or document identifier queried
        date_window_ist:
          type: string
          description: Evaluated Asia/Kolkata (IST) date window
        row_count:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
    SmritiQueryResponse:
      type: object
      required:
        - headline
        - answer_markdown
        - citations
        - latency_ms
        - trace_id
      properties:
        headline:
          type: string
          description: Concise executive scope headline
        answer_markdown:
          type: string
          description: Verified prose and Markdown tables with inline [Source · Window] tags
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        degraded_sources:
          type: array
          items:
            type: string
          description: Non-critical live sources that timed out or degraded gracefully
        latency_ms:
          type: integer
        trace_id:
          type: string
